# Builds and publishes releases for the three update channels:
# Release titles: "X.Y.Z stable|beta|nightly" – the tag keeps its suffix only to stay unique.
# Each build also replaces the moving release "stable", "beta" or "nightly" (same files), so
# releases/download/<channel>/… always points at the newest version of that channel.
# Pushes to main build nothing; a build is started on purpose after the push by pushing ONE tag for the
# pushed VERSION (deploy/release.sh): nightly by default, beta or stable instead – never several for one push.
#   nightly – tag vX.Y.Z-nightly: pre-release, notes from the CHANGELOG.md section X.Y.Z, newest 10 kept
#   beta    – tag vX.Y.Z-beta: pre-release, notes from the RELEASES.md section X.Y.Z-beta (required)
#   stable  – tag vX.Y.Z-stable (before 1.33.5: vX.Y.Z): release, notes from the RELEASES.md section X.Y.Z (required)
# X.Y.Z of the tag must equal the VERSION file of the tagged commit; an existing number per channel fails.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version and notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # section "## [X]" of a notes file, without its heading
          section() { awk -v h="## [$1]" 'index($0, h) == 1 {f=1; next} /^## \[/ {f=0} f' "$2" | sed '/./,$!d'; }
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-stable|-beta|-nightly)?$ ]] || { echo "tag must be vX.Y.Z-stable, -beta or -nightly"; exit 1; }
          # VERSION is exactly X.Y.Z (the local build counter A never belongs in Git) and matches the tag
          grep -qxE '[0-9]+\.[0-9]+\.[0-9]+' VERSION || { echo "VERSION must be X.Y.Z"; exit 1; }
          [ "${VERSION%-*}" = "$(cat VERSION)" ] || { echo "tag ${GITHUB_REF_NAME} does not match VERSION $(cat VERSION)"; exit 1; }
          if [[ "$VERSION" == *-nightly ]]; then
            # nightly: the CHANGELOG.md section of this version, else the commit messages since the last nightly
            section "$(cat VERSION)" CHANGELOG.md > notes.md
            if [ ! -s notes.md ]; then
              LAST="$(git tag -l 'v*-nightly*' --sort=-creatordate | grep -vx "$GITHUB_REF_NAME" | head -1 || true)"
              { echo "Nightly build of ${GITHUB_SHA::7} – untested."; echo
                git log --no-merges --format='- %s' ${LAST:+$LAST..}HEAD | head -40; } > notes.md
            fi
            PRE=true
          else
            # beta and stable: the summarised section from RELEASES.md (required; stable as ## [X.Y.Z])
            section "${VERSION%-stable}" RELEASES.md > notes.md
            [ -s notes.md ] || { echo "RELEASES.md has no section ## [${VERSION%-stable}]"; exit 1; }
            PRE=$([[ "$VERSION" == *-beta ]] && echo true || echo false)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          mkdir -p out
          for ARCH in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -trimpath \
              -ldflags "-s -w -X 'main.version=${{ steps.meta.outputs.version }}'" \
              -o out/pebble-webhook-linux-$ARCH ./cmd/pebble-webhook
          done
          cp install.sh out/
          (cd out && sha256sum pebble-webhook-linux-* install.sh > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.meta.outputs.version }}"
          FLAGS=()
          [ "${{ steps.meta.outputs.prerelease }}" = true ] && FLAGS+=(--prerelease --latest=false)
          # Titel: Nummer ohne Kanal-Endung plus fester Kanal (stable/beta/nightly); Builds unterscheidet das Datum.
          case "$V" in *-nightly*) CH=nightly ;; *-beta*) CH=beta ;; *) CH=stable ;; esac
          # Jede Nummer gibt es je Kanal genau einmal; jeder Commit hebt VERSION an. Gibt es sie schon, ist das ein Fehler.
          if gh release view "v$V" >/dev/null 2>&1; then echo "release v$V exists – VERSION was not bumped" >&2; exit 1; fi
          gh release create "v$V" out/* --title "${V%%-*} $CH" --notes-file notes.md --target "$GITHUB_SHA" "${FLAGS[@]}"

      - name: Move the channel release (stable / beta / nightly)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.meta.outputs.version }}"
          case "$V" in *-nightly*) CH=nightly ;; *-beta*) CH=beta ;; *) CH=stable ;; esac
          # Fester Tag je Kanal: .../releases/download/<kanal>/… ist immer die neueste Version des Kanals.
          gh release delete "$CH" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$CH" out/* --title "$CH – always the newest ($V)" --target "$GITHUB_SHA" --prerelease --latest=false \
            --notes "Moving release: always the newest $CH build, currently v$V. New installations start with stable; the channel is changed in the web app (Updates → Kanal)."

      - name: Keep the newest 10 nightlies
        if: ${{ endsWith(github.ref, '-nightly') }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq '.[] | select(.tagName | contains("-nightly")) | .tagName' \
            | tail -n +11 | xargs -r -n1 gh release delete --yes --cleanup-tag

      # --- Docker-Image (Docker Hub): dieselben Binaries aus out/, ein Build je Release (amd64 + arm64). ---
      # Feste Tags: X.Y.Z-<kanal> (stable zusätzlich X.Y.Z). Gleitende Tags werden nur umgehängt, nie neu gebaut:
      #   nightly → :nightly · beta → :beta, :nightly · stable → :stable, :latest, :X.Y, :X, :beta, :nightly
      # jeweils nur, wenn die neue Version mindestens so hoch ist wie die dort hängende (gleiche Nummer: stable > beta > nightly).
      # Ohne Variable DOCKERHUB_IMAGE (z. B. in Forks) entfällt alles.
      - name: Docker – Anmelden
        if: ${{ vars.DOCKERHUB_IMAGE != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - if: ${{ vars.DOCKERHUB_IMAGE != '' }}
        uses: docker/setup-buildx-action@v3

      - name: Docker – Bauen und feste Tags
        if: ${{ vars.DOCKERHUB_IMAGE != '' }}
        id: docker
        shell: bash
        env:
          IMG: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          V="${{ steps.meta.outputs.version }}"
          case "$V" in *-nightly) CH=nightly ;; *-beta) CH=beta ;; *) CH=stable ;; esac
          N="${V%%-*}"
          # Fester Tag nur X.Y.Z: eine Version ist dieselbe, egal in welchem Kanal (gleicher Code); der Kanal steht im Label.
          docker buildx build -f docker/Dockerfile --platform linux/amd64,linux/arm64 --push -t "$IMG:$N" \
            --build-arg IMAGE="$IMG" \
            --label org.opencontainers.image.version="$N-$CH" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            .
          echo "ch=$CH" >> "$GITHUB_OUTPUT"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Docker – Gleitende Tags umhängen
        if: ${{ vars.DOCKERHUB_IMAGE != '' }}
        shell: bash
        env:
          IMG: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          set -euo pipefail
          CH="${{ steps.docker.outputs.ch }}" N="${{ steps.docker.outputs.n }}"
          rank() { case "$1" in stable) echo 3 ;; beta) echo 2 ;; nightly) echo 1 ;; *) echo 0 ;; esac; }
          # Vergleichsschlüssel X.Y.Z.<rang>; ohne Tag oder Label 0
          key_of() {
            local l
            l="$(docker buildx imagetools inspect "$IMG:$1" --format '{{json .Image}}' 2>/dev/null \
              | jq -r 'if has("config") then .config.Labels["org.opencontainers.image.version"] else (to_entries[0].value.config.Labels["org.opencontainers.image.version"]) end // empty' || true)"
            [[ "$l" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(stable|beta|nightly)$ ]] && echo "${BASH_REMATCH[1]}.$(rank "${BASH_REMATCH[2]}")" || echo 0
          }
          NEW="$N.$(rank "$CH")"
          case "$CH" in
            nightly) MOVE=(nightly) ;;
            beta)    MOVE=(beta nightly) ;;
            stable)  MOVE=(stable latest "${N%.*}" "${N%%.*}" beta nightly) ;;
          esac
          for t in "${MOVE[@]}"; do
            CUR="$(key_of "$t")"
            if [ "$(printf '%s\n%s\n' "$CUR" "$NEW" | sort -V | tail -1)" = "$NEW" ]; then
              docker buildx imagetools create -t "$IMG:$t" "$IMG:$N"
              echo ":$t → $N-$CH (vorher ${CUR})"
            else
              echo ":$t bleibt (${CUR} > ${NEW})"
            fi
          done
